<div class="panel-popout-container">

  <!-- Panel Content - Render based on type -->
  <div class="popout-content" [ngSwitch]="panelType">
    <!-- Picker (domain-agnostic - uses config from domainConfig.pickers) -->
    <ng-container *ngSwitchCase="'picker'">
      <app-base-picker
        *ngIf="getPickerConfig()"
        [config]="getPickerConfig()"
        (selectionChange)="onPickerSelectionChange($event)">
      </app-base-picker>
    </ng-container>
    <!-- Statistics Panel (CDK Mixed Orientation Chart Grid) -->
    <ng-container *ngSwitchCase="'statistics-2'">
      <app-statistics-panel-2
        [domainConfig]="domainConfig"
        [chartIds]="getChartIdsForPanel()">
      </app-statistics-panel-2>
    </ng-container>
    <!-- Dockview Statistics Panel -->
    <ng-container *ngSwitchCase="'dockview-statistics'">
      <app-dockview-statistics-panel
        [domainConfig]="domainConfig"
        [chartIds]="['manufacturer', 'top-models']">
      </app-dockview-statistics-panel>
    </ng-container>
    <!-- Individual Chart -->
    <ng-container *ngSwitchCase="'chart'">
      <app-base-chart
        [dataSource]="getChartDataSource()"
        [statistics]="resourceService.statistics$ | async"
        [highlights]="resourceService.highlights$ | async"
        [selectedValue]="null"
        (chartClick)="onChartClick($event)">
      </app-base-chart>
    </ng-container>
    <!-- Dynamic Results Table -->
    <ng-container *ngSwitchCase="'basic-results'">
      <app-dynamic-results-table
        [domainConfig]="domainConfig"
        (urlParamsChange)="onUrlParamsChange($event)">
      </app-dynamic-results-table>
    </ng-container>
    <!-- Unknown panel type -->
    <ng-container *ngSwitchDefault>
      <div class="unknown-panel">
        <p>Unknown panel type: {{ panelType }}</p>
        <p>Panel ID: {{ panelId }}</p>
      </div>
    </ng-container>
  </div>
</div>
